<!-- Supabase → Authentication → Emails → Templates → "Confirm signup"
     Asunto sugerido: Confirma tu cuenta en Zabori -->
<div style="margin:0;padding:24px 12px;background:#fffaea;font-family:Arial,Helvetica,sans-serif;color:#04323c">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;border:1px solid #efdc96">
    <tr>
      <td style="padding:22px 24px;background:#fdc52a;border-radius:16px 16px 0 0;text-align:center">
        <img src="https://zabori-landing.vercel.app/logo-zabori.png" alt="Zabori" width="130" style="display:inline-block;border:0">
      </td>
    </tr>
    <tr>
      <td style="padding:28px 24px 8px">
        <h1 style="margin:0 0 12px;font-size:22px;color:#034d5b">Confirma tu correo</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.5">
          ¡Gracias por crear tu cuenta en Zabori! Toca el botón para confirmar tu correo y entrar directo a tu cuenta.
        </p>
        <p style="margin:0 0 24px;text-align:center">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 26px;border-radius:999px;background:#034d5b;color:#fdc52a;font-weight:bold;font-size:15px;text-decoration:none">Confirmar mi cuenta</a>
        </p>
        <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#4d6a71">
          Si no creaste una cuenta en Zabori, ignora este correo.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 24px 22px;font-size:12px;color:#4d6a71;text-align:center">
        Zabori · El sabor de elegir bien
      </td>
    </tr>
  </table>
</div>
